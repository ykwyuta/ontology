[project]
name = "legal-onto"
version = "0.1.0"
description = "TypeDB による日本法の知識表現と法的判断クエリ"
requires-python = ">=3.12"
dependencies = ["typedb-driver==3.13.6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
legal-onto = "legal_onto.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["typedb: TypeDB サーバ（docker compose）が必要なテスト"]
